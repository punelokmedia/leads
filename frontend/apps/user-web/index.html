<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <title>Leads Sell</title>
    <style>
      .boot-shell{font-family:Arial,sans-serif;color:#334155}.boot-shell *{box-sizing:border-box}.boot-shell .block{display:block;border-radius:8px;background:#e8ecf1;position:relative;overflow:hidden}.boot-shell .block::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,#ffffff80 50%,transparent 80%);transform:translateX(-100%);animation:boot-shimmer 1.6s ease-in-out infinite}.boot-nav{height:100px;padding:20px max(24px,calc((100vw - 1320px)/2));display:flex;justify-content:space-between;align-items:center}.boot-nav .block{width:170px;height:44px}.boot-nav .block+ .block{width:360px;height:36px}.boot-hero{display:flex;align-items:center;justify-content:space-between;gap:48px;min-height:626px;padding:60px max(52px,calc((100vw - 1320px)/2));background:#0a1c42}.boot-copy{width:48%;display:grid;gap:18px}.boot-hero .block{background:#263954;height:16px;width:80%}.boot-hero .heading{height:34px;width:70%}.boot-hero .button{height:42px;width:40%;margin-top:24px}.boot-hero .art{height:420px;width:45%;border-radius:20px}.boot-section{max-width:1320px;margin:auto;padding:64px 52px 100px}.boot-section>.block{width:40%;height:34px}.boot-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:30px 16px;margin-top:36px}.boot-grid .block{aspect-ratio:1.65;min-height:140px;border-radius:17px}body:has(.boot-shell){margin:0}.boot-help{padding:16px;text-align:center}.boot-help a{color:#0066ff}.boot-shell[data-page="inner"] .boot-hero{background:white;min-height:360px;max-width:1320px;margin:auto;padding:40px 52px}.boot-shell[data-page="inner"] .boot-hero .block{background:#e8ecf1}.boot-shell[data-page="inner"] .art{height:290px}@keyframes boot-shimmer{to{transform:translateX(100%)}}@media(max-width:1000px){.boot-nav{height:88px}.boot-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.boot-hero{min-height:560px}}@media(max-width:700px){.boot-nav{height:80px;padding:16px 20px}.boot-nav .block+ .block{width:40px}.boot-hero,.boot-shell[data-page="inner"] .boot-hero{flex-direction:column;align-items:stretch;padding:40px 20px 0;min-height:650px;gap:28px}.boot-copy{width:100%}.boot-hero .heading{height:28px}.boot-hero .art{height:290px;width:100%}.boot-section{padding:40px 20px}.boot-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}.boot-grid .block{min-height:125px}}@media(prefers-reduced-motion:reduce){.boot-shell .block::after{animation:none;background:none}}
    .boot-failed .boot-hero,.boot-failed .boot-section{display:none}.boot-failed .block::after{animation:none}</style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-label="Loading page" aria-busy="true">
        <div class="boot-nav" aria-hidden="true"><span class="block"></span><span class="block"></span></div>
        <div class="boot-hero" aria-hidden="true"><div class="boot-copy"><span class="block heading"></span><span class="block heading"></span><span class="block"></span><span class="block"></span><span class="block button"></span></div><span class="block art"></span></div>
        <div class="boot-section" aria-hidden="true"><div class="boot-section-heading"><span class="block"></span><span class="block"></span><span class="block"></span></div><div class="boot-grid"><span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span><span class="block"></span></div></div>
        <p class="boot-help" hidden>Taking longer than expected. Check your connection and <a href="">retry loading</a>.</p>
      </div>
    </div>
    <noscript><p>This website needs JavaScript. Enable JavaScript and refresh the page.</p><style>.boot-shell{display:none}.boot-failed .boot-hero,.boot-failed .boot-section{display:none}.boot-failed .block::after{animation:none}</style></noscript>
    <script>
      const shell = document.querySelector('.boot-shell');
      if (location.pathname !== '/' || location.search) shell.dataset.page = 'inner';
      if (location.pathname === '/' && !['category', 'city', 'browse'].some(key => new URLSearchParams(location.search).has(key))) {
        const heroPreload = document.createElement('link');
        heroPreload.rel = 'preload'; heroPreload.as = 'image'; heroPreload.href = '/optimized/home/hero.webp'; heroPreload.fetchPriority = 'high';
        document.head.appendChild(heroPreload);
      }
      function showLoadingHelp() { const help = document.querySelector('.boot-help'); if (help) { help.hidden = false; document.querySelector('.boot-shell').setAttribute('aria-busy', 'false'); document.querySelector('.boot-shell').classList.add('boot-failed'); } }
      setTimeout(showLoadingHelp, 20000);
      window.addEventListener('error', event => { if (event.target && event.target.tagName === 'SCRIPT') showLoadingHelp(); }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
